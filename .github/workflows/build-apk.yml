name: Build PR Business APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q PRBusiness_Android_Prototype.zip

      - name: Enable AndroidX
        run: echo "android.useAndroidX=true" >> PRBusiness/gradle.properties

      - name: Find Gradle files
        run: |
          find . \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "gradle.properties" \) -print
       
      - name: Show Java and Kotlin targets
        run: |
          grep -R -n -E 'VERSION_1_8|VERSION_17|jvmTarget|JvmTarget' PRBusiness --include='*.gradle' --include='*.gradle.kts' || true
      
      - name: Build APK
        run: gradle -p PRBusiness assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PR-Business-APK
          path: PRBusiness/app/build/outputs/apk/debug/app-debug.apk
