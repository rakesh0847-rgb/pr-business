name: Build PR Business APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest



    
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable
      cache: true

  - name: Create fresh Flutter project
    run: |
      flutter create --platforms=android --org com.prbusiness pr_business
      cd pr_business
      flutter pub get

  - name: Build APK
    run: |
      cd pr_business
      flutter build apk --debug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: PR-Business-APK
      path: pr_business/build/app/outputs/flutter-apk/app-debug.apk
